<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Womble voice states</title><link rel="stylesheet" href="womble.css"><style>body{margin:0;background:var(--womble-charcoal);color:var(--womble-cream);font:18px system-ui;text-align:center}main{max-width:420px;margin:40px auto;padding:24px}img{width:230px;margin:25px}button{padding:12px;margin:4px;border:0;border-radius:12px;background:var(--womble-pink);color:#242321}h1{font:36px Georgia}small{display:block;margin:20px}</style><main data-voice-state="idle"><img class="womble-head" src="../assets/womble-head-colour.png" alt="Womble"><h1>womble <sup style="font-size:40%">#1</sup></h1><p id="state" role="status">Ready when you are.</p><button onclick="setState('listening')">Listen</button><button onclick="setState('idle')">Ready</button><small>Visual state demo only. This page does not activate a microphone.</small></main><script>function setState(s){document.querySelector('main').dataset.voiceState=s;document.querySelector('#state').textContent=s==='listening'?'Listening…':'Ready when you are.'}</script></html>
