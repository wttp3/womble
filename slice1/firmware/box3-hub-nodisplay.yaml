# ESP32-S3-BOX-3 -> petit hub (slice 1). No HA.
# Pins/codec verified 2026-10-15 against official esphome/wake-word-voice-assistants esp32-s3-box-3.yaml (main).
# Based on the structure of the official ESPHome voice firmware:
#   https://github.com/esphome/wake-word-voice-assistants/blob/main/esp32-s3-box-3/esp32-s3-box-3.yaml
# Before flashing, DIFF the pin/codec blocks against that file for ESPHome 2026.9.x. This is a trimmed
# version without the LVGL display pages; the LCD is only backlight + status text for now.
# Secrets live in secrets.yaml (not committed): api_key, wifi_ssid, wifi_password, ota_password.

substitutions:
  name: grok-box3-dash
  friendly_name: Kitchen BOX-3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

# The hub (aioesphomeapi client on petit) connects here exactly like HA would.
# The BOX-3 MUST be removed/disabled in Home Assistant, otherwise HA also claims the voice pipeline.
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s   # don't reboot if hub is down

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:              # keep the known address
    static_ip: 192.168.0.90
    gateway: 192.168.0.1  # VERIFY router IP
    subnet: 255.255.255.0

i2c:
  - id: i2c_adc_dac
    scl: GPIO18
    sda: GPIO8

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    i2c_id: i2c_adc_dac
    id: es7210_adc
    mic_gain: 27db          # 24 default was quiet; 33 risked hurting wake word. Hub adds software gain.
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    i2c_id: i2c_adc_dac
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    sample_rate: 16000
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_dout_pin: GPIO15
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac
    buffer_duration: 100ms

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON

switch:
  - platform: gpio
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
    internal: true

media_player:
  - platform: speaker
    id: box_media
    name: Media Player
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: box_speaker
      format: WAV          # hub serves 48 kHz mono WAV
      sample_rate: 48000
      num_channels: 1

micro_wake_word:
  id: mww
  models:
    - okay_nabu            # same stock models as official firmware
    - model: models/womble.json   # custom 'Womble' (micro v2 manifest, local)
    - hey_jarvis
  on_wake_word_detected:
    - logger.log:
        level: INFO
        format: "WAKE detected: %s"
        args: [ 'wake_word.c_str()' ]
    - lambda: id(status_text).publish_state("wake");
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: box_media
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_listening:
    - lambda: id(status_text).publish_state("listening");
  on_stt_end:
    - lambda: id(status_text).publish_state(x.c_str());
  on_tts_start:
    - lambda: id(status_text).publish_state("replying");
  on_end:
    # as official: wait for the reply announcement to finish before re-arming wake word
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
  on_error:
    - lambda: id(status_text).publish_state("error");

# Self-heal: if the hub is connected but neither the wake word engine nor a pipeline is running
# (e.g. a reply playback that never finished, or a missed restart), re-arm microWakeWord.
interval:
  - interval: 15s
    then:
      - if:
          condition:
            and:
              - api.connected:
              - not: voice_assistant.is_running
              - not: micro_wake_word.is_running
              - not: media_player.is_announcing
          then:
            - logger.log:
                level: WARN
                format: "microWakeWord was idle with hub connected; re-arming"
            - micro_wake_word.start:

text_sensor:
  - platform: template
    id: status_text
    name: Voice status

button:
  - platform: template
    name: Talk
    on_press:
      - micro_wake_word.stop:
      - voice_assistant.start:
  - platform: restart
    name: Restart
