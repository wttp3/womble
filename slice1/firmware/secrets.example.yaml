# copy to secrets.yaml (never commit). Generate api_key with: python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
wifi_ssid: "CHANGE_ME"
wifi_password: "CHANGE_ME"
api_key: "CHANGE_ME_BASE64_32_BYTES"
ota_password: "CHANGE_ME"
# static network for wifi.manual_ip (keep the BOX-3 on a known address)
box3_static_ip: "<box3-ip>"
box3_gateway: "<gateway-ip>"
box3_subnet: "255.255.255.0"
box3_dns: "<gateway-ip>"
